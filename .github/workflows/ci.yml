# Development runs npm run test:all locally. Hosted checks are explicit or release-only.
name: CI
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Acceptance or bounded catalog investigation
        type: choice
        options: [acceptance, catalog]
        default: acceptance
      profile:
        description: Disposable container resource profile
        type: choice
        options: [normal, constrained]
        default: normal
      cache:
        description: Reuse layers or rebuild this run without cache
        type: choice
        options: [normal, cold]
        default: normal
      repeat:
        description: Catalog repetitions (1–10)
        type: string
        default: '3'
      seed:
        description: Catalog scheduling seed (0–2147483647)
        type: string
        default: '126'
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    name: Acceptance / replay
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the published release belongs to main
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9][a-z0-9.-]*)?$ ]] || { echo 'Use a version tag such as v1.2.3 or v1.2.3-rc.1'; exit 1; }
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Run the common acceptance/replay runner
        env:
          REPLAY_SCOPE: ${{ inputs.scope || 'acceptance' }}
          REPLAY_PROFILE: ${{ inputs.profile || 'normal' }}
          REPLAY_CACHE: ${{ inputs.cache || 'normal' }}
          REPLAY_REPEAT: ${{ inputs.repeat || '3' }}
          REPLAY_SEED: ${{ inputs.seed || '126' }}
        run: |
          node scripts/check-local.mjs --ref HEAD --scope "$REPLAY_SCOPE" --profile "$REPLAY_PROFILE" --cache "$REPLAY_CACHE" --repeat "$REPLAY_REPEAT" --seed "$REPLAY_SEED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: acceptance-evidence-${{ github.run_attempt }}
          path: .data/local-checks/*/artifacts/compact/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: acceptance-traces-${{ github.run_attempt }}
          path: .data/local-checks/*/artifacts/traces/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
  publish:
    needs: acceptance
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      commit: ${{ github.sha }}
      release_tag: ${{ github.event.release.tag_name }}
